trigger:
  branches:
    include:
      - main
      - develop

resources:
  repositories:
    - repository: self
      trigger: none

variables:
  resource-group: 'DevOpsTraining'
  location: 'East US'
  subscriptionid: 'e7facdf7-fa6b-4145-98fc-b54e7f336a8f'
  azureserviceconnection: 'Demo_session'   # ARM Service connection created in Azure DevOps
  webappname: 'eshoponweb-priyanshu'       # Azure Web App name

stages:

# ─────────────────────────────────────────────
# STAGE 1 — BUILD & TEST (CI)
# ─────────────────────────────────────────────
- stage: Build
  displayName: Build .Net Core Solution
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: 'restore'
        projects: '**/*.sln'
        feedsToUse: 'select'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: '**/*.sln'

    - task: DotNetCoreCLI@2
      displayName: Test
      inputs:
        command: 'test'
        projects: 'tests/UnitTests/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Web/Web.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/Website'

    - task: ArchiveFiles@2
      displayName: Zip Website Output
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/Website'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/Web.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: Publish CI Artifacts
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/Web.zip'
        artifact: 'eshoponweb-ci'
        publishLocation: 'pipeline'

# ─────────────────────────────────────────────
# STAGE 2 — DEPLOY TO AZURE WEB APP (CD)
# ─────────────────────────────────────────────
- stage: Deploy
  displayName: Deploy to WebApp
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - download: current
      artifact: eshoponweb-ci
      displayName: Download CI Artifacts

    - task: AzureWebApp@1
      displayName: Publish Website to WebApp
      inputs:
        azureSubscription: '$(azureserviceconnection)'
        appType: 'webAppLinux'
        appName: '$(webappname)'
        package: '$(Pipeline.Workspace)/eshoponweb-ci/Web.zip'
